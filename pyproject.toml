[project]
name = "personal-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic==0.122.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai==3.2.0",
  # Phase L. mcp is held below 2.0.0 because mcp-server-fetch declares mcp<2 -
  # measured, not assumed: 2.0.0 fails with ResolutionImpossible.
  "mcp==1.29.0",
  "mcp-server-fetch==2026.8.18",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
