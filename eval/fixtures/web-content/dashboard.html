<!doctype html>
<meta charset="utf-8">
<title>Quartzite — capacity dashboard</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; }
  table { border-collapse: collapse; margin-top: 1rem; }
  td, th { border: 1px solid #ccc; padding: .35rem .7rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  #total { font-weight: 600; }
</style>

<h1>Capacity dashboard</h1>
<p>Provisioned capacity per region, refreshed hourly.</p>

<table>
  <thead><tr><th>Region</th><th>Nodes</th><th>Cores each</th><th>Total cores</th></tr></thead>
  <tbody id="rows"></tbody>
  <tfoot><tr><th colspan="3">Fleet total</th><th id="total">—</th></tr></tfoot>
</table>

<p>Fleet total is computed client-side from the figures above.</p>

<script>
  // The page ships the inputs, never the answer. A reader that does not execute
  // this sees an empty table and a dash.
  const REGIONS = [
    { name: "eu-west-1",   nodes: 14, cores: 8  },
    { name: "eu-north-1",  nodes:  6, cores: 16 },
    { name: "us-east-2",   nodes: 23, cores: 8  },
    { name: "ap-south-1",  nodes:  9, cores: 32 },
    { name: "sa-east-1",   nodes:  4, cores: 16 },
  ];

  let total = 0;
  const body = document.getElementById("rows");
  for (const r of REGIONS) {
    const cores = r.nodes * r.cores;
    total += cores;
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + r.name + "</td><td>" + r.nodes + "</td>" +
      "<td>" + r.cores + "</td><td>" + cores + "</td>";
    body.appendChild(tr);
  }
  document.getElementById("total").textContent = total;
</script>
